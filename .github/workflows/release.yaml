name: 🚀 Release to PyPI
on:
  push:
    tags: ["*"]
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  tag-build:
    name: 🏗️ Build
    uses: tox-dev/github-workflows/.github/workflows/validate-python-release.yaml@bceb5c005e19823dc8835f536f53f172ae223927 # 6.5.0
    permissions:
      contents: read
  notes:
    name: 📝 Render GitHub Release notes
    uses: tox-dev/github-workflows/.github/workflows/release-notes.yaml@bceb5c005e19823dc8835f536f53f172ae223927 # 6.5.0
    permissions:
      contents: read
    with:
      tag: ${{ github.ref_name }}
      changelog: docs/changelog.rst
      artifact-url: https://pypi.org/project/tox/${{ github.ref_name }}/
  publish:
    name: 🚀 Publish to PyPI
    needs: tag-build
    runs-on: ubuntu-26.04
    environment:
      name: release
      url: https://pypi.org/project/tox/${{ github.ref_name }}
    permissions:
      id-token: write
    steps:
      - name: 📩 Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.tag-build.outputs.distributions-artifact-id }}
          path: dist/
      - name: 🚀 Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist
  github-release:
    name: 🚀 Publish GitHub Release
    needs: [tag-build, publish, notes]
    uses: tox-dev/github-workflows/.github/workflows/github-release.yaml@bceb5c005e19823dc8835f536f53f172ae223927 # 6.5.0
    permissions:
      contents: write
    with:
      project: tox
      version: ${{ github.ref_name }}
      tag: ${{ github.ref_name }}
      title-prefix: v
      artifact-pattern: python-package-distributions
      notes-artifact-id: ${{ needs.notes.outputs.artifact-id }}
