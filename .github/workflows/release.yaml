name: Release to PyPI
on:
  push:
    tags: ["*"]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
permissions:
  contents: read
env:
  dists-artifact-name: python-package-distributions
jobs:
  tag-build:
    name: Validate tagged release
    uses: tox-dev/github-workflows/.github/workflows/validate-python-release.yaml@9a4e76e2f4901856f2784f6c0efc89278c518b1f
    permissions:
      contents: read
      pull-requests: read
    with:
      changelog: docs/changelog.rst
      fragments: docs/changelog
      format: rst
      issue-role: issue
      artifact-base-url: https://pypi.org/project/tox/
  previous-tag:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      previous: ${{ steps.select.outputs.previous }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: latest-known
          python-version: "3.15"
          enable-cache: false
      - name: Create release-tool environment
        run: uv venv --python 3.15 "$RUNNER_TEMP/release-tools"
      - name: Install locked release tools
        run: >-
          uv pip sync --preview-features pylock --python "$RUNNER_TEMP/release-tools/bin/python" --group release pylock.toml
      - name: Select previous tag
        id: select
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          previous=$(git tag --list | "$RUNNER_TEMP/release-tools/bin/release-creator" tags "$TAG" --previous)
          printf 'previous=%s\n' "$previous" >>"$GITHUB_OUTPUT"
  contributor-metadata:
    needs: previous-tag
    runs-on: ubuntu-26.04
    environment: release
    permissions:
      contents: write
    steps:
      - name: Fetch contributor metadata
        if: needs.previous-tag.outputs.previous != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PREVIOUS: ${{ needs.previous-tag.outputs.previous }}
        run: >-
          gh api -X POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" -f tag_name="$TAG" -f previous_tag_name="$PREVIOUS" --jq .body >"$RUNNER_TEMP/generated-notes.md"
      - name: Fetch first-release contributor metadata
        if: needs.previous-tag.outputs.previous == ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: >-
          gh api -X POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" -f tag_name="$TAG" --jq .body >"$RUNNER_TEMP/generated-notes.md"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: github-generated-notes
          path: ${{ runner.temp }}/generated-notes.md
          if-no-files-found: error
  github-notes:
    needs: [tag-build, contributor-metadata]
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: github-generated-notes
          path: ${{ runner.temp }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: latest-known
          python-version: "3.15"
          enable-cache: false
      - name: Create release-tool environment
        run: uv venv --python 3.15 "$RUNNER_TEMP/release-tools"
      - name: Install locked release tools
        run: >-
          uv pip sync --preview-features pylock --python "$RUNNER_TEMP/release-tools/bin/python" --group release pylock.toml
      - name: Add release tools to PATH
        run: echo "$RUNNER_TEMP/release-tools/bin" >>"$GITHUB_PATH"
      - uses: tox-dev/github-workflows/render-release-notes@9a4e76e2f4901856f2784f6c0efc89278c518b1f
        with:
          tag: ${{ github.ref_name }}
          changelog: docs/changelog.rst
          repository: ${{ github.repository }}
          issue-role: issue
          artifact-url: https://pypi.org/project/tox/${{ github.ref_name }}/
          generated-notes: ${{ runner.temp }}/generated-notes.md
          output: ${{ runner.temp }}/release-notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: github-release-notes
          path: ${{ runner.temp }}/release-notes.md
          if-no-files-found: error
  github-draft:
    name: Stage GitHub Release
    needs: github-notes
    runs-on: ubuntu-26.04
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: github-release-notes
          path: ${{ runner.temp }}
      - uses: tox-dev/github-workflows/publish-github-release@9a4e76e2f4901856f2784f6c0efc89278c518b1f
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          repository: ${{ github.repository }}
          tag: ${{ github.ref_name }}
          commit: ${{ github.sha }}
          title: v${{ github.ref_name }}
          notes-file: ${{ runner.temp }}/release-notes.md
          mode: stage
  stage:
    name: Check PyPI distributions
    needs: [tag-build, github-notes, github-draft]
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      missing-count: ${{ steps.stage.outputs.missing-count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ env.dists-artifact-name }}
          path: dist/
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: latest-known
          python-version: "3.15"
          enable-cache: false
      - uses: tox-dev/github-workflows/reconcile-pypi-artifacts@9a4e76e2f4901856f2784f6c0efc89278c518b1f
        id: stage
        with:
          project: tox
          version: ${{ github.ref_name }}
          dist: dist
          mode: stage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pypi-missing-manifest
          path: ${{ steps.stage.outputs.manifest }}
          if-no-files-found: error
  publish:
    name: 🚀 publish
    needs: stage
    if: needs.stage.outputs.missing-count != '0'
    runs-on: ubuntu-26.04
    environment:
      name: release
      url: https://pypi.org/project/tox/${{ github.ref_name }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ env.dists-artifact-name }}
          path: dist/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pypi-missing-manifest
          path: ${{ runner.temp }}/pypi-manifest
      - uses: tox-dev/github-workflows/select-pypi-artifacts@9a4e76e2f4901856f2784f6c0efc89278c518b1f
        with:
          dist: dist
          manifest: ${{ runner.temp }}/pypi-manifest/pypi-missing-names.txt
          output-dir: missing-dist
          expected-count: ${{ needs.stage.outputs.missing-count }}
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: missing-dist
          skip-existing: true
  verify-pypi:
    name: Verify PyPI distributions
    needs: [stage, publish, github-draft]
    if: always() && needs.stage.result == 'success' && needs.github-draft.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.publish.result)
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ env.dists-artifact-name }}
          path: dist/
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: latest-known
          python-version: "3.15"
          enable-cache: false
      - uses: tox-dev/github-workflows/reconcile-pypi-artifacts@9a4e76e2f4901856f2784f6c0efc89278c518b1f
        with:
          project: tox
          version: ${{ github.ref_name }}
          dist: dist
          mode: verify
  github-release:
    needs: [verify-pypi, github-notes, github-draft]
    runs-on: ubuntu-26.04
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: github-release-notes
          path: ${{ runner.temp }}
      - uses: tox-dev/github-workflows/publish-github-release@9a4e76e2f4901856f2784f6c0efc89278c518b1f
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          repository: ${{ github.repository }}
          tag: ${{ github.ref_name }}
          commit: ${{ github.sha }}
          title: v${{ github.ref_name }}
          notes-file: ${{ runner.temp }}/release-notes.md
          mode: publish
