name: 🧪 check
on:
  workflow_dispatch:
  push:
    branches: ["main"]
    tags-ignore: ["**"]
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: "3 7 * * *"
permissions:
  contents: read
env:
  FORCE_COLOR: 1
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    name: 🧪 test ${{ matrix.py }} on ${{ matrix.os.name }}
    runs-on: ${{ matrix.os.image }}
    strategy:
      fail-fast: false
      matrix:
        py:
          - "3.15"
          - "3.14"
          - "3.13"
          - "3.12"
          - "3.11"
        os:
          - {image: ubuntu-26.04, name: ubuntu}
          - {image: windows-2025-vs2026, name: windows}
          - {image: macos-26, name: macos}
        # macOS runs only 3.15 on every event; its other interpreters add no macOS-specific coverage.
        exclude:
          - {os: {image: macos-26, name: macos}, py: "3.14"}
          - {os: {image: macos-26, name: macos}, py: "3.13"}
          - {os: {image: macos-26, name: macos}, py: "3.12"}
          - {os: {image: macos-26, name: macos}, py: "3.11"}
    steps:
      - name: 📥 Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 🐍 Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: latest-known
          python-version: "3.15"
          enable-cache: false
          cache-dependency-glob: "pyproject.toml"
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: ⚙️ Add .local/bin to Windows PATH
        if: runner.os == 'Windows'
        shell: bash
        run: echo "$USERPROFILE/.local/bin" >> $GITHUB_PATH
      - name: 🐍 Install Python for packaging
        run: uv python install 3.15
      - name: 📦 Install tox@self
        run: uv tool install --python-preference only-managed --python ${{ matrix.py }} tox@.
      - name: 📦 Set up test suite
        run: tox run -vv --notest --skip-missing-interpreters false -e ${{ matrix.py }}
      - name: 🧪 Run test suite
        run: tox run --skip-pkg-install -e ${{ matrix.py }}
        env:
          PYTEST_ADDOPTS: "-vv --durations=20"
          DIFF_AGAINST: ${{ github.event.pull_request.base.sha || 'HEAD' }}
          PYTEST_XDIST_AUTO_NUM_WORKERS: 0
      - name: 📤 Upload test timings
        if: ${{ !cancelled() }} # codespell:ignore cancelled
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-${{ matrix.py }}-${{ matrix.os.name }}
          path: .tox/junit.${{ matrix.py }}.xml
          if-no-files-found: warn
          retention-days: 30
  check:
    name: 🔍 tox env
    uses: tox-dev/github-workflows/.github/workflows/check.yaml@bceb5c005e19823dc8835f536f53f172ae223927 # 6.5.0
    permissions:
      contents: read
    with:
      include: |
        [
          {"env": "type"},
          {"env": "type-min", "python": "3.11"},
          {"env": "dev"},
          {"env": "docs"},
          {"env": "pkg_meta"},
          {"env": "type", "os": "windows-2025-vs2026"},
          {"env": "type-min", "python": "3.11", "os": "windows-2025-vs2026"},
          {"env": "dev", "os": "windows-2025-vs2026"},
          {"env": "pkg_meta", "os": "windows-2025-vs2026"}
        ]
      tox-install: tox@.
      exclude-newer-package: python-discovery=2026-10-30T23:24:25Z
  release:
    name: 🏷️ Release dry run
    uses: $/.github/workflows/prepare-release.yaml
    permissions:
      contents: read
      pull-requests: read
    with:
      dry-run: true
  hooks:
    name: 🧹 Hooks under the cooldown
    uses: tox-dev/github-workflows/.github/workflows/cooled-hooks.yaml@e9dabf0e11825edd2b7ac6c152d9f4900f188815 # 6.7.0
    permissions:
      contents: read
  gate:
    name: 🚦 ${{ github.event_name == 'pull_request' && 'Required checks pass' || 'Non-PR checks pass' }}
    if: ${{ !cancelled() }} # codespell:ignore cancelled
    needs: [test, check, release, hooks]
    runs-on: ubuntu-26.04
    steps:
      - name: 🚦 Require all needed jobs to pass
        uses: tox-dev/github-workflows/required-checks@bceb5c005e19823dc8835f536f53f172ae223927 # 6.5.0
        with:
          needs: ${{ toJSON(needs) }}
