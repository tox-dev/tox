name: Label maintenance PRs
on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] Reads PR metadata without checkout or PR code.
    types: [opened, reopened, synchronize]
permissions: {}
jobs:
  label:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - uses: tox-dev/github-workflows/label-bot-news@7afb8fc8fd51942c5deedf9012dd49ed9c7b5bc1
        with:
          fragments: docs/changelog
          extension: rst
