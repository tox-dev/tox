name: Label maintenance PRs
on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] Reads PR metadata without checkout or PR code.
    types: [opened, reopened, synchronize]
permissions: {}
jobs:
  label:
    runs-on: ubuntu-26.04
    permissions:
      issues: write
      pull-requests: read
    steps:
      - uses: tox-dev/github-workflows/label-bot-news@e8d429040f73cd95af722543a0a09717bf3bb0aa
        with:
          fragments: docs/changelog
          extension: rst
