name: Label maintenance PRs
on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] Reads PR metadata without checkout or PR code.
    types: [opened, reopened, synchronize]
permissions: {}
jobs:
  label:
    runs-on: ubuntu-26.04
    permissions:
      issues: write
      pull-requests: read
    steps:
      - uses: tox-dev/github-workflows/label-bot-news@9a4e76e2f4901856f2784f6c0efc89278c518b1f
        with:
          fragments: docs/changelog
          extension: rst
