name: Upgrade release tools
on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 2"
permissions: {}
concurrency:
  group: upgrade-release-tools
  cancel-in-progress: false
jobs:
  upgrade:
    uses: tox-dev/github-workflows/.github/workflows/upgrade-release-tools.yaml@961281cba49418a682b2bb123ae4a1c4d22f74ff
    permissions:
      contents: read
    secrets:
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
    with:
      build-requirements: |-
        Cython>=3.0
        setuptools>=80
      python-version: "3.15"
      exclude-newer-packages: release-creator=2026-10-22T13:51:56Z
      commit-message: "build(deps): refresh release lock"
      pull-request-title: "build(deps): refresh full project lock"
      pull-request-body: |-
        Refresh the full selectable full project lock after the seven-day cooldown.
        Release and changelog workflows install the `release` selection from `pylock.toml`.
