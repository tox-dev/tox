name: 🔒 Upgrade release tools
on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 2"
permissions: {}
concurrency:
  group: upgrade-release-tools
  cancel-in-progress: false
jobs:
  upgrade:
    name: 🔀 Upgrade release tools
    uses: tox-dev/github-workflows/.github/workflows/upgrade-release-tools.yaml@bf1c3ab0aa137d307a07aad844d507af73039387 # 6.8.0
    permissions:
      contents: read
    secrets:
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
    with:
      commit-message: "build(deps): refresh release lock"
      pull-request-title: "build(deps): refresh full project lock"
      pull-request-body: |-
        Relock `pylock.toml` under the seven-day cooldown.
