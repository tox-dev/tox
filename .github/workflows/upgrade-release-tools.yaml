name: Upgrade release tools
on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 2"
permissions: {}
concurrency:
  group: upgrade-release-tools
  cancel-in-progress: false
jobs:
  upgrade:
    uses: tox-dev/github-workflows/.github/workflows/upgrade-release-tools.yaml@e8d429040f73cd95af722543a0a09717bf3bb0aa
    permissions:
      actions: write
      contents: write
      pull-requests: write
    with:
      python-version: "3.15"
      check-workflow: check.yaml
      commit-message: "build(deps): refresh release lock"
      pull-request-title: "build(deps): refresh full project lock"
      pull-request-body: |-
        Refresh the full selectable full project lock after the seven-day cooldown.
        Release and changelog workflows install the `release` selection from `pylock.toml`.
