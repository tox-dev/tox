version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    labels:
      - dependencies
      - github_actions
      - skip news
    schedule:
      interval: "weekly"
      day: "tuesday"
    groups:
      github-actions:
        patterns:
          - "*"
    cooldown:
      default-days: 7
  - package-ecosystem: "pre-commit"
    directory: "/"
    labels:
      - dependencies
      - skip news
    schedule:
      interval: "weekly"
      day: "tuesday"
    allow:
      - dependency-name: black
      - dependency-name: mdformat-frontmatter
      - dependency-name: mdformat-gfm
      - dependency-name: mdformat-ruff
      - dependency-name: sphinx
    cooldown:
      default-days: 7
